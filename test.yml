name: ProtonAI CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install ALL dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pydantic pandas numpy scikit-learn matplotlib jsonschema scipy pydicom SimpleITK nibabel opencv-python-headless

    - name: Debug - Test imports manually
      run: |
        echo "=== Testing imports ==="
        python -c "import pandas; print('pandas OK')"
        python -c "import pydantic; print('pydantic OK')"
        python -c "import numpy; print('numpy OK')"
        echo "=== Testing validators.py ==="
        python -c "import validators; print('validators.py OK')" || echo "validators.py FAILED"
        echo "=== Testing test_validators.py ==="
        python -c "import test_validators; print('test_validators.py OK')" || echo "test_validators.py FAILED"

    - name: Run tests
      run: |
        pytest test_validators.py -vvv --tb=long
