name: ProtonAI CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pydantic pandas numpy scikit-learn matplotlib jsonschema

    - name: Verify files exist
      run: |
        echo "Checking project files..."
        ls -la
        test -f test_validators.py && echo "✅ test_validators.py found" || echo "❌ test_validators.py NOT found"
        test -f validators.py && echo "✅ validators.py found" || echo "❌ validators.py NOT found"

    - name: Run tests
      run: |
        pytest test_validators.py -v --tb=short
