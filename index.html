<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ProtonAI NEXUS</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--bg:#070b14;--card:rgba(22,27,39,.7);--line:#2a3242;--acc:#22d3ee;--acc2:#a78bfa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:var(--bg);color:#e6edf3;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px}
.logo{font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 28px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
h3{margin:0 0 12px;font-size:14px;color:#9fb0c8}
.big{font-size:28px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
button{background:#1b2334;color:#e6edf3;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.group-A{background:#ef444422;color:#ef4444;border:1px solid #ef444466;padding:4px 12px;border-radius:999px;font-weight:800}
.group-B{background:#22d3ee22;color:#22d3ee;border:1px solid #22d3ee66;padding:4px 12px;border-radius:999px;font-weight:800}
.group-C{background:#a78bfa22;color:#a78bfa;border:1px solid #a78bfa66;padding:4px 12px;border-radius:999px;font-weight:800}
.row{display:flex;justify-content:space-between;margin:8px 0;font-size:13px}
.label{color:#9fb0c8}
.bar{height:6px;border-radius:3px;background:#2a3242;margin-top:8px}
.fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#22d3ee,#a78bfa)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const PROTOCOLS = {
  0: {label:"A — Focused High-Dose", dose:"74 Gy", fractions:"37", beam:"IMPT", margin:"3mm", confidence:0.87},
  1: {label:"B — Wide-Field High-Dose", dose:"70 Gy", fractions:"35", beam:"PSPT", margin:"5mm", confidence:0.79},
  2: {label:"C — Standard Protocol", dose:"66 Gy", fractions:"33", beam:"IMPT", margin:"4mm", confidence:0.83}
};

function RadiomicClassifier({lang}) {
  const [group] = useState(1);
  const p = PROTOCOLS[group];
  const labels = lang === "ar"
    ? {0:"A — جرعة عالية مركزة", 1:"B — تغطية واسعة", 2:"C — بروتوكول قياسي"}
    : {0:"A — Focused High-Dose", 1:"B — Wide-Field", 2:"C — Standard"};
  return (
    <div className="card" style={{borderColor:"#22d3ee44"}}>
      <h3>{lang==="ar"?"مصنف الورم الإشعاعي":"Radiomic Tumor Classifier"}</h3>
      <span className={`group-${["A","B","C"][group]}`}>{labels[group]}</span>
      <div style={{marginTop:12}}>
        <div className="row"><span className="label">{lang==="ar"?"الجرعة":"Dose"}</span><span style={{fontWeight:600}}>{p.dose}</span></div>
        <div className="row"><span className="label">{lang==="ar"?"الجلسات":"Fractions"}</span><span style={{fontWeight:600}}>{p.fractions}</span></div>
        <div className="row"><span className="label">{lang==="ar"?"نوع الحزمة":"Beam"}</span><span style={{fontWeight:600}}>{p.beam}</span></div>
        <div className="row"><span className="label">{lang==="ar"?"هامش الصلابة":"Margin"}</span><span style={{fontWeight:600}}>{p.margin}</span></div>
        <div className="row"><span className="label">{lang==="ar"?"الدقة":"Confidence"}</span><span style={{fontWeight:600}}>{(p.confidence*100).toFixed(1)}%</span></div>
        <div className="bar"><div className="fill" style={{width:`${p.confidence*100}%`}}/></div>
      </div>
    </div>
  );
}

function App() {
  const [lang, setLang] = useState("en");
  return (
    <div>
      <header>
        <span className="logo">ProtonAI NEXUS</span>
        <button onClick={()=>setLang(lang==="en"?"ar":"en")}>{lang==="en"?"ع":"EN"}</button>
      </header>
      <div className="grid">
        <div className="card">
          <h3>{lang==="ar"?"إحصائيات المنصة":"Platform Stats"}</h3>
          <div className="big">421</div>
          <p style={{color:"#9fb0c8",fontSize:13}}>{lang==="ar"?"مريض تم تحليله":"Patients Analyzed"}</p>
          <div className="big" style={{marginTop:16}}>3</div>
          <p style={{color:"#9fb0c8",fontSize:13}}>{lang==="ar"?"مجموعات علاجية":"Treatment Groups"}</p>
        </div>
        <RadiomicClassifier lang={lang}/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
