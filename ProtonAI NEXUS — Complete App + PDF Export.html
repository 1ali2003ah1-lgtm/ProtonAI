<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ProtonAI NEXUS — Proton Therapy CDSS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:'Inter',sans-serif;font-size:16px;scroll-behavior:smooth}
body{background:#030712;color:#e2e8f0;min-height:100vh;overflow-x:hidden}
[dir="rtl"]{font-family:'Inter',sans-serif}

/* ═══════════════════════════════════════════════════════════
   ANIMATED BACKGROUND
═══════════════════════════════════════════════════════════ */
#bg-canvas{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:0;overflow:hidden;
}
.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(0,212,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,.04) 1px, transparent 1px);
  background-size:60px 60px;
}
.glow-cyan{
  position:absolute;top:-20%;right:-10%;
  width:700px;height:700px;border-radius:50%;
  background:radial-gradient(circle, rgba(0,212,255,.12) 0%, transparent 65%);
  animation:floatGlow 12s ease-in-out infinite;
}
.glow-purple{
  position:absolute;bottom:-20%;left:-10%;
  width:700px;height:700px;border-radius:50%;
  background:radial-gradient(circle, rgba(124,58,237,.12) 0%, transparent 65%);
  animation:floatGlow 15s ease-in-out infinite reverse;
}
@keyframes floatGlow{
  0%,100%{transform:translate(0,0)}
  33%{transform:translate(30px,-40px)}
  66%{transform:translate(-20px,20px)}
}

/* ═══════════════════════════════════════════════════════════
   SPLASH SCREEN
═══════════════════════════════════════════════════════════ */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:#030712;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  animation:splashFade 0.6s ease-out 3.2s forwards;
}
@keyframes splashFade{to{opacity:0;pointer-events:none;visibility:hidden}}

.splash-logo{
  font-size:72px;font-weight:900;letter-spacing:-2px;line-height:1;
  background:linear-gradient(135deg,#00d4ff 0%,#7c3aed 50%,#06ffa5 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:splashPulse 2s ease-in-out infinite;
}
@keyframes splashPulse{0%,100%{opacity:1}50%{opacity:.75}}

.splash-sub{
  font-size:17px;font-weight:400;color:#94a3b8;letter-spacing:.5px;
  text-align:center;max-width:380px;line-height:1.5;
}
.splash-author{
  font-size:13px;font-weight:600;color:#00d4ff;
  letter-spacing:4px;text-transform:uppercase;
}
.splash-bar-wrap{
  width:260px;height:3px;background:#1a2535;border-radius:2px;overflow:hidden;
}
.splash-bar{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,#00d4ff,#7c3aed,#06ffa5);
  animation:barFill 3s ease-in-out forwards;
}
@keyframes barFill{from{width:0}to{width:100%}}

/* ═══════════════════════════════════════════════════════════
   MAIN APP WRAPPER
═══════════════════════════════════════════════════════════ */
#app-root{position:relative;z-index:1;min-height:100vh}

/* ═══════════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════════ */
.site-header{
  position:sticky;top:0;z-index:100;
  background:rgba(3,7,18,.85);
  backdrop-filter:blur(16px);
  border-bottom:1px solid #1a2535;
  padding:14px 32px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  flex-wrap:wrap;
}
.header-left{display:flex;flex-direction:column;gap:2px}
.header-logo-text{
  font-size:22px;font-weight:900;letter-spacing:-0.5px;
  background:linear-gradient(90deg,#00d4ff,#7c3aed);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.header-sub{font-size:11px;font-weight:400;color:#64748b}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{
  font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;
  border:1px solid #1a2535;color:#94a3b8;white-space:nowrap;
}
.badge-v{background:#0d1626;border-color:#00d4ff33;color:#00d4ff}
.btn-lang{
  font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
  padding:6px 14px;border-radius:6px;
  background:#0d1626;border:1px solid #00d4ff55;color:#00d4ff;
  transition:all .2s;white-space:nowrap;
}
.btn-lang:hover{background:#00d4ff15;border-color:#00d4ff}

/* ═══════════════════════════════════════════════════════════
   HERO
═══════════════════════════════════════════════════════════ */
.hero{
  padding:72px 32px 48px;
  max-width:1200px;margin:0 auto;
  display:flex;flex-direction:column;align-items:flex-start;gap:28px;
}
[dir="rtl"] .hero{align-items:flex-end;text-align:right}
.hero-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px;border-radius:20px;
  background:#00d4ff0d;border:1px solid #00d4ff33;
  font-size:12px;font-weight:600;color:#00d4ff;
}
.hero-pill-dot{
  width:7px;height:7px;border-radius:50%;background:#00d4ff;
  animation:blink 1.4s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.hero-title{
  font-size:56px;font-weight:900;line-height:1.08;letter-spacing:-2px;
  color:#f8fafc;max-width:800px;
}
.hero-title-grad{
  background:linear-gradient(135deg,#00d4ff,#7c3aed,#06ffa5);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero-desc{
  font-size:17px;font-weight:400;color:#94a3b8;
  line-height:1.65;max-width:640px;
}
.hero-sig{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 20px;border-radius:30px;
  border:1px solid #1a2535;
  font-size:13px;font-weight:500;color:#64748b;
}
.hero-sig strong{color:#00d4ff;font-weight:700}

/* ═══════════════════════════════════════════════════════════
   STATS ROW
═══════════════════════════════════════════════════════════ */
.stats-section{
  padding:0 32px 56px;
  max-width:1200px;margin:0 auto;
}
.stats-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr)}}

.stat-card{
  background:#0d1626;border:1px solid #1a2535;border-radius:12px;
  padding:20px 16px;text-align:center;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  cursor:default;
}
.stat-card:hover{
  transform:translateY(-4px);
  border-color:#00d4ff44;
  box-shadow:0 8px 32px rgba(0,212,255,.08);
}
.stat-num{
  font-size:30px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(135deg,#00d4ff,#7c3aed);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  display:block;margin-bottom:4px;
}
.stat-label{font-size:12px;font-weight:500;color:#64748b}

/* ═══════════════════════════════════════════════════════════
   TWO-COLUMN LAYOUT
═══════════════════════════════════════════════════════════ */
.two-col{
  display:grid;grid-template-columns:1fr 1fr;gap:24px;
  padding:0 32px 32px;max-width:1200px;margin:0 auto;
}
@media(max-width:860px){.two-col{grid-template-columns:1fr}}

/* ═══════════════════════════════════════════════════════════
   CARDS (shared)
═══════════════════════════════════════════════════════════ */
.card{
  background:#0d1626;border:1px solid #1a2535;border-radius:16px;
  padding:28px;overflow:hidden;position:relative;
}
.card-title{
  font-size:15px;font-weight:700;color:#e2e8f0;margin-bottom:20px;
  display:flex;align-items:center;gap:8px;
}
.card-title-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.dot-cyan{background:#00d4ff;box-shadow:0 0 8px #00d4ff88}
.dot-purple{background:#7c3aed;box-shadow:0 0 8px #7c3aed88}

/* ═══════════════════════════════════════════════════════════
   GROUP SELECTOR BUTTONS
═══════════════════════════════════════════════════════════ */
.group-btns{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.group-btn{
  font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
  padding:6px 18px;border-radius:6px;border:1px solid #1a2535;
  background:#030712;color:#64748b;
  transition:all .2s;
}
.group-btn.active-a{background:#00d4ff15;border-color:#00d4ff;color:#00d4ff}
.group-btn.active-b{background:#7c3aed15;border-color:#7c3aed;color:#a78bfa}
.group-btn.active-c{background:#06ffa515;border-color:#06ffa5;color:#06ffa5}

/* ═══════════════════════════════════════════════════════════
   GROUP BADGE
═══════════════════════════════════════════════════════════ */
.group-badge{
  display:inline-block;padding:4px 14px;border-radius:20px;
  font-size:12px;font-weight:700;margin-bottom:16px;
}
.badge-a{background:#00d4ff15;border:1px solid #00d4ff44;color:#00d4ff}
.badge-b{background:#7c3aed15;border:1px solid #7c3aed44;color:#a78bfa}
.badge-c{background:#06ffa515;border:1px solid #06ffa544;color:#06ffa5}

/* ═══════════════════════════════════════════════════════════
   INFO ROWS
═══════════════════════════════════════════════════════════ */
.info-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid #1a253566;font-size:13px;
}
.info-row:last-of-type{border-bottom:none}
.info-label{color:#64748b;font-weight:500}
.info-val{color:#e2e8f0;font-weight:600}

/* ═══════════════════════════════════════════════════════════
   CONFIDENCE BAR
═══════════════════════════════════════════════════════════ */
.conf-wrap{margin-top:20px}
.conf-header{
  display:flex;justify-content:space-between;
  font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:8px;
}
.conf-pct{font-size:20px;font-weight:900;color:#06ffa5}
.conf-track{
  height:6px;background:#1a2535;border-radius:3px;overflow:hidden;
}
.conf-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,#00d4ff,#06ffa5);
  transition:width .6s cubic-bezier(.4,0,.2,1);
}

/* ═══════════════════════════════════════════════════════════
   CT VIEWER
═══════════════════════════════════════════════════════════ */
.ct-canvas-wrap{
  background:#020408;border-radius:10px;overflow:hidden;
  position:relative;border:1px solid #1a2535;margin-bottom:16px;
}
.ct-labels{
  position:absolute;top:10px;left:10px;right:10px;
  display:flex;justify-content:space-between;
  font-size:10px;font-weight:600;color:#00d4ff;
  font-variant-numeric:tabular-nums;
  pointer-events:none;
}
canvas#ctCanvas{display:block;width:100%;height:auto}

.ct-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#64748b}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.legend-line{width:16px;height:2px;border:2px dashed #00d4ff;flex-shrink:0}

/* ═══════════════════════════════════════════════════════════
   PATIENT EXPLORER
═══════════════════════════════════════════════════════════ */
.patient-section{
  padding:0 32px 32px;max-width:1200px;margin:0 auto;
}
.patient-grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:8px;margin-bottom:24px;
}
@media(max-width:900px){.patient-grid{grid-template-columns:repeat(6,1fr)}}
@media(max-width:600px){.patient-grid{grid-template-columns:repeat(4,1fr)}}

.pat-btn{
  font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;
  padding:7px 4px;border-radius:7px;
  background:#030712;border:1px solid #1a2535;color:#64748b;
  transition:all .18s;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pat-btn:hover{border-color:#00d4ff55;color:#00d4ff;background:#00d4ff08}
.pat-btn.selected{background:#00d4ff12;border-color:#00d4ff;color:#00d4ff}

/* Patient detail */
.pat-detail{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
  animation:fadeSlide .3s ease;
}
@media(max-width:700px){.pat-detail{grid-template-columns:1fr}}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.pat-col{background:#030712;border:1px solid #1a2535;border-radius:10px;padding:16px}
.pat-field{font-size:12px;padding:6px 0;border-bottom:1px solid #1a253544}
.pat-field:last-child{border-bottom:none}
.pat-field-label{color:#64748b;font-weight:500;font-size:11px;margin-bottom:2px}
.pat-field-val{color:#e2e8f0;font-weight:600}

.protocol-tag{
  display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;
}
.proto-0{background:#00d4ff15;color:#00d4ff;border:1px solid #00d4ff33}
.proto-1{background:#7c3aed15;color:#a78bfa;border:1px solid #7c3aed33}
.proto-2{background:#06ffa515;color:#06ffa5;border:1px solid #06ffa533}

/* ═══════════════════════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════════════════════ */
.site-footer{
  margin-top:40px;padding:40px 32px;
  background:#0d1626;border-top:1px solid #1a2535;
  text-align:center;
}
.footer-logo{
  font-size:26px;font-weight:900;letter-spacing:-0.5px;
  background:linear-gradient(90deg,#00d4ff,#7c3aed,#06ffa5);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:12px;
}
.footer-credits{font-size:13px;color:#64748b;margin-bottom:16px;line-height:1.6}
.footer-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.footer-tag{
  font-size:11px;font-weight:600;padding:4px 12px;border-radius:16px;
  background:#030712;border:1px solid #1a2535;color:#475569;
}

/* ═══════════════════════════════════════════════════════════
   FADE-IN ANIMATION (cards)
═══════════════════════════════════════════════════════════ */
.fade-in{animation:fadeIn .5s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ═══════════════════════════════════════════════════════════
   PDF EXPORT BUTTON
═══════════════════════════════════════════════════════════ */
.btn-pdf{
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  padding:10px 22px;border-radius:8px;
  background:linear-gradient(135deg,#00d4ff22,#7c3aed22);
  border:1px solid #00d4ff55;color:#00d4ff;
  display:inline-flex;align-items:center;gap:8px;
  transition:all .2s;margin-top:20px;
}
.btn-pdf:hover{background:linear-gradient(135deg,#00d4ff33,#7c3aed33);border-color:#00d4ff;box-shadow:0 0 16px #00d4ff22}
.btn-pdf:active{transform:scale(.97)}
.btn-pdf-icon{font-size:15px}

/* section spacer */
.section-label{
  font-size:11px;font-weight:700;color:#475569;
  letter-spacing:2px;text-transform:uppercase;
  padding:0 32px;max-width:1200px;margin:0 auto 16px;
  display:block;
}
</style>
</head>

<!-- ══ BACKGROUND ══ -->
<div id="bg-canvas" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="glow-cyan"></div>
  <div class="glow-purple"></div>
</div>

<!-- ══ SPLASH ══ -->
<div id="splash" role="status" aria-label="Loading ProtonAI NEXUS">
  <div class="splash-logo">ProtonAI</div>

  <div class="splash-author">Ali Hussein Thajil</div>
  <div class="splash-bar-wrap">
    <div class="splash-bar"></div>
  </div>
</div>

<!-- ══ APP ROOT ══ -->
<div id="app-root"></div>

/* ─── CT DRAWING FUNCTION ─────────────────────────────────── */
function drawCT(canvas, patientId, groupIdx) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  // dark BG
  ctx.fillStyle = '#020408';
  ctx.fillRect(0,0,W,H);

  // lung field (ellipse — left lung)
  const lx = W*0.3, ly = H*0.5, lrx = W*0.22, lry = H*0.36;
  ctx.beginPath();
  ctx.ellipse(lx, ly, lrx, lry, 0, 0, Math.PI*2);
  ctx.fillStyle = '#1a3a2a';
  ctx.fill();
  ctx.strokeStyle = '#2a5a3a';
  ctx.lineWidth = 1;
  ctx.stroke();

  // lung field (right lung)
  const rx2 = W*0.68, ry2 = H*0.5, rrx = W*0.20, rry = H*0.33;
  ctx.beginPath();
  ctx.ellipse(rx2, ry2, rrx, rry, 0, 0, Math.PI*2);
  ctx.fillStyle = '#1a3a2a';
  ctx.fill();
  ctx.strokeStyle = '#2a5a3a';
  ctx.lineWidth = 1;
  ctx.stroke();

  // rib cage hints
  for(let i=0;i<6;i++){
    const y = H*0.2 + i*(H*0.1);
    ctx.beginPath();
    ctx.arc(W*0.5, H*0.5, W*0.44 - i*4, Math.PI*0.1, Math.PI*0.9);
    ctx.strokeStyle = `rgba(60,80,70,${0.4-i*0.05})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // spine
  ctx.fillStyle = '#3a3030';
  ctx.beginPath();
  ctx.ellipse(W*0.5, H*0.5, W*0.04, H*0.1, 0, 0, Math.PI*2);
  ctx.fill();

  // tumor — size varies by group
  const tumorR = groupIdx===1 ? W*0.11 : groupIdx===2 ? W*0.085 : W*0.065;
  const tx = W*0.3, ty = H*0.42;
  const grd = ctx.createRadialGradient(tx, ty, 0, tx, ty, tumorR);
  grd.addColorStop(0, 'rgba(220,50,50,0.95)');
  grd.addColorStop(0.6, 'rgba(180,30,30,0.7)');
  grd.addColorStop(1, 'rgba(140,20,20,0.3)');
  ctx.beginPath();
  ctx.arc(tx, ty, tumorR, 0, Math.PI*2);
  ctx.fillStyle = grd;
  ctx.fill();

  // GTV-1 dashed cyan contour
  ctx.beginPath();
  ctx.arc(tx, ty, tumorR+8, 0, Math.PI*2);
  ctx.strokeStyle = '#00d4ff';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  // crosshair on tumor
  ctx.strokeStyle = 'rgba(0,212,255,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();ctx.moveTo(tx-18,ty);ctx.lineTo(tx+18,ty);ctx.stroke();
  ctx.beginPath();ctx.moveTo(tx,ty-18);ctx.lineTo(tx,ty+18);ctx.stroke();

  // scan lines
  for(let y=0;y<H;y+=4){
    ctx.fillStyle = `rgba(0,0,0,${0.08})`;
    ctx.fillRect(0,y,W,2);
  }

  // frame corner decorations
  const c = '#00d4ff44', cs = 14;
  ctx.strokeStyle=c;ctx.lineWidth=1.5;
  [[0,0,1,0],[0,0,0,1],[W,0,-1,0],[W,0,0,1],
   [0,H,1,0],[0,H,0,-1],[W,H,-1,0],[W,H,0,-1]].forEach(([bx,by,dx,dy],i)=>{
    if(i%2===0){ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+dx*cs,by);ctx.stroke();}
    else{ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by+dy*cs);ctx.stroke();}
  });
}

          <button key={i} className={`group-btn${sel===i?' '+['active-a','active-b','active-c'][i]:''}`}
            onClick={()=>setSel(i)}>{lb}</button>
        ))}
      </div>
      <div className={`group-badge ${badgeCls}`}>{t.groupBadge[sel]}</div>
      <p style={{fontSize:'12px',color:'#94a3b8',marginBottom:'16px',lineHeight:'1.5'}}>{t.groupDesc[sel]}</p>
      {t.infoKeys.map((k,i)=>(
        <div key={i} className="info-row">
          <span className="info-label">{k}</span>
          <span className="info-val">{rows[i]}</span>
        </div>
      ))}
      <div className="conf-wrap">
        <div className="conf-header">
          <span>{t.confLabel}</span>
          <span className="conf-pct">{g.conf}%</span>
        </div>
        <div className="conf-track">
          <div className="conf-fill" style={{width:`${g.conf}%`}}></div>
        </div>
      </div>
    </div>
  );
}

/* ─── CT VIEWER COMPONENT ──────────────────────────────────── */
function CTViewer({lang, selectedPatient}) {
  const t = T[lang];
  const canvasRef = React.useRef(null);
  const pat = selectedPatient || PATIENTS[0];

  React.useEffect(()=>{
    drawCT(canvasRef.current, pat.id, pat.group);
  },[pat]);

  return (
    <div className="card fade-in">
      <div className="card-title">
        <span className="card-title-dot dot-purple"></span>
        {t.ctTitle}
      </div>
      <div className="ct-canvas-wrap">
        <div className="ct-labels">
          <span>{pat.id}</span>
          <span>Slices: {pat.slices}</span>
        </div>
        <canvas id="ctCanvas" ref={canvasRef} width="440" height="300"
          style={{display:'block',width:'100%',height:'auto'}}></canvas>
        <div style={{position:'absolute',bottom:'10px',left:'10px',
          background:'rgba(220,50,50,0.85)',color:'#fff',
          fontSize:'10px',fontWeight:'700',padding:'2px 8px',borderRadius:'4px'}}>
          ● GTV-1
        </div>
      </div>
      <div className="ct-legend">
        <div className="legend-item">
          <div className="legend-dot" style={{background:'rgba(220,50,50,0.85)'}}></div>
          <span>{t.legendLabels[0]}</span>
        </div>
        <div className="legend-item">
          <div className="legend-line"></div>
          <span>{t.legendLabels[1]}</span>
        </div>
        <div className="legend-item">
          <div className="legend-dot" style={{background:'#1a3a2a',border:'1px solid #2a5a3a'}}></div>
          <span>{t.legendLabels[2]}</span>
        </div>
      </div>
    </div>
  );
}

/* ─── PATIENT EXPLORER ──────────────────────────────────────── */
function PatientExplorer({lang, onSelect}) {
  const t = T[lang];
  const [sel, setSel] = React.useState(0);
  const pat = PATIENTS[sel];

  function handleSelect(i) {
    setSel(i);
    if(onSelect) onSelect(PATIENTS[i]);
  }

  const colFields = [
    [pat.id, pat.age, pat.gender, pat.stage],
    [pat.histology, pat.survival, pat.volume.toLocaleString(), pat.meanHU.toFixed(1)],
    [pat.entropy.toFixed(3), pat.skewness.toFixed(3), pat.slices, null],
  ];

  return (
    <section className="patient-section">
      <div className="card fade-in">
        <div className="card-title">
          <span className="card-title-dot dot-cyan"></span>
          {t.patTitle}
        </div>
        <div className="patient-grid">
          {PATIENTS.map((p,i)=>(
            <button key={p.id}
              className={`pat-btn${sel===i?' selected':''}`}
              onClick={()=>handleSelect(i)}>
              {p.id.replace('LUNG1-','')}
            </button>
          ))}
        </div>
        <div className="pat-detail">
          {/* Col 1 */}
          <div className="pat-col">
            {t.patCols[0].map((lbl,i)=>(
              <div key={i} className="pat-field">
                <div className="pat-field-label">{lbl}</div>
                <div className="pat-field-val">{colFields[0][i]}</div>
              </div>
            ))}
          </div>
          {/* Col 2 */}
          <div className="pat-col">
            {t.patCols[1].map((lbl,i)=>(
              <div key={i} className="pat-field">
                <div className="pat-field-label">{lbl}</div>
                <div className="pat-field-val">{colFields[1][i]}</div>
              </div>
            ))}
          </div>
          {/* Col 3 */}
          <div className="pat-col">
            {t.patCols[2].slice(0,3).map((lbl,i)=>(
              <div key={i} className="pat-field">
                <div className="pat-field-label">{lbl}</div>
                <div className="pat-field-val">{colFields[2][i]}</div>
              </div>
            ))}
            <div className="pat-field">
              <div className="pat-field-label">{t.patCols[2][3]}</div>
              <div className="pat-field-val">
                <span className={`protocol-tag proto-${pat.group}`}>{pat.protocol}</span>
              </div>
            </div>
          </div>
        </div>

        {/* ── Export PDF Button ── */}
        <div style={{textAlign:'center',marginTop:'8px'}}>
          <button className="btn-pdf" onClick={()=>generatePDF(pat, lang)}>
            <span className="btn-pdf-icon">📄</span>
            {lang==='en' ? `Export PDF Report — ${pat.id}` : `تصدير تقرير PDF — ${pat.id}`}
          </button>
        </div>

      </div>
    </section>
  );
}

/* ─── FOOTER ──────────────────────────────────────────────── */
function Footer({lang}) {
  const t = T[lang];
  return (
    <footer className="site-footer">
      <div className="footer-logo">ProtonAI NEXUS</div>
      <div className="footer-credits">{t.footer.credits}</div>
      <div className="footer-tags">
        {t.footer.tags.map((tag,i)=>(
          <span key={i} className="footer-tag">{tag}</span>
        ))}
      </div>
    </footer>
  );
}

/* ─── ROOT APP ──────────────────────────────────────────────── */
function App() {
  const [lang, setLang] = React.useState('en');
  const [selectedPat, setSelectedPat] = React.useState(PATIENTS[0]);

  function toggleLang() {
    const next = lang==='en'?'ar':'en';
    setLang(next);
    document.documentElement.lang = next;
    document.documentElement.dir = next==='ar'?'rtl':'ltr';
  }

  return (
    <div id="app-root">
      <Header lang={lang} onToggleLang={toggleLang}/>
      <Hero lang={lang}/>
      <Stats lang={lang}/>
      <span className="section-label">
        {lang==='en'?'Diagnostic Modules':'وحدات التشخيص'}
      </span>
      <div className="two-col">
        <Classifier lang={lang}/>
        <CTViewer lang={lang} selectedPatient={selectedPat}/>
      </div>
      <PatientExplorer lang={lang} onSelect={setSelectedPat}/>
      <Footer lang={lang}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<App/>);
</script>
</body>
</html>
