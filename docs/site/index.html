<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ProtonAI NEXUS — Ali Hussein Thajil</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#030712;--card:#0d1626;--card2:#0a1020;--line:#1a2535;--line2:#243040;
  --acc:#00d4ff;--acc2:#7c3aed;--acc3:#06ffa5;
  --text:#e2e8f0;--muted:#64748b;--muted2:#8899aa;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.025) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}
.bg-g1{position:fixed;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.06),transparent 65%);top:-250px;right:-150px;pointer-events:none;z-index:0;animation:glow1 8s ease-in-out infinite}
.bg-g2{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.06),transparent 65%);bottom:-200px;left:-150px;pointer-events:none;z-index:0;animation:glow2 10s ease-in-out infinite}
@keyframes glow1{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,20px)}}
@keyframes glow2{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-30px)}}
.splash{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s ease,visibility 1s ease}
.splash.out{opacity:0;visibility:hidden;pointer-events:none}
.sp-logo{font-size:72px;font-weight:900;background:linear-gradient(135deg,var(--acc),var(--acc2),var(--acc3));-webkit-background-clip:text;background-clip:text;color:transparent;animation:spIn 1.2s cubic-bezier(.16,1,.3,1)}
.sp-sub{font-size:17px;color:var(--muted2);margin-top:12px;animation:spUp .8s ease .4s both}
.sp-name{font-size:13px;color:var(--acc);font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-top:8px;animation:spUp .8s ease .6s both}
.sp-track{width:220px;height:2px;background:var(--line2);border-radius:2px;margin-top:48px;overflow:hidden;animation:spUp .8s ease .8s both}
.sp-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc3));border-radius:2px;animation:spBar 2.8s ease .9s both}
@keyframes spIn{from{opacity:0;transform:scale(.7) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes spUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spBar{from{width:0}to{width:100%}}
header{position:sticky;top:0;z-index:200;background:rgba(3,7,18,.85);backdrop-filter:blur(24px);border-bottom:1px solid var(--line);padding:0 36px;height:66px;display:flex;align-items:center;justify-content:space-between}
.h-brand{display:flex;flex-direction:column}
.h-logo{font-size:19px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.3px}
.h-sub{font-size:10px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-top:1px}
.h-nav{display:flex;gap:8px;align-items:center}
.badge{padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid rgba(0,212,255,.25);color:var(--acc);background:rgba(0,212,255,.05);letter-spacing:.3px}
.badge-green{border-color:rgba(6,255,165,.25);color:var(--acc3);background:rgba(6,255,165,.05)}
.btn-lang{padding:7px 16px;border-radius:10px;border:1px solid var(--acc2);background:rgba(124,58,237,.12);color:#a78bfa;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:all .2s}
.btn-lang:hover{background:rgba(124,58,237,.22)}
main{position:relative;z-index:1;padding:36px 36px 60px}
.hero{text-align:center;padding:56px 0 48px;max-width:860px;margin:0 auto}
.hero-pill{display:inline-flex;align-items:center;gap:10px;padding:7px 18px;border-radius:999px;border:1px solid rgba(0,212,255,.25);background:rgba(0,212,255,.04);font-size:12px;color:var(--acc);font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:28px}
.hero-dot{width:7px;height:7px;border-radius:50%;background:var(--acc3);animation:pulse 1.8s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.hero-h{font-size:56px;font-weight:900;line-height:1.08;margin-bottom:18px;letter-spacing:-1.5px}
.hero-h span{background:linear-gradient(135deg,var(--acc),var(--acc2) 50%,var(--acc3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-p{font-size:17px;color:var(--muted2);line-height:1.75;max-width:640px;margin:0 auto 36px}
.hero-sig{font-size:12px;color:var(--acc);font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:9px 22px;border:1px solid rgba(0,212,255,.2);border-radius:999px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:28px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 16px;text-align:center;position:relative;overflow:hidden;transition:border-color .3s,transform .2s}
.sc:hover{border-color:rgba(0,212,255,.4);transform:translateY(-2px)}
.sc::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,212,255,.03),transparent 60%);pointer-events:none}
.sn{font-size:38px;font-weight:900;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.sl{font-size:10px;color:var(--muted);margin-top:7px;text-transform:uppercase;letter-spacing:.9px;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;transition:border-color .3s}
.card-hl{border-color:rgba(0,212,255,.18);background:linear-gradient(135deg,var(--card),rgba(0,212,255,.025))}
.ct{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.ct-bar{width:3px;height:16px;background:linear-gradient(var(--acc),var(--acc2));border-radius:2px;flex-shrink:0}
.gb{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:999px;font-weight:800;font-size:13px;margin-bottom:18px;letter-spacing:.2px}
.gA{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.3)}
.gB{background:rgba(0,212,255,.1);color:var(--acc);border:1px solid rgba(0,212,255,.3)}
.gC{background:rgba(124,58,237,.1);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}
.sel{display:flex;gap:8px;margin-bottom:22px}
.sb{flex:1;padding:11px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;font-family:inherit}
.sb.on{border-color:var(--acc);color:var(--acc);background:rgba(0,212,255,.07)}
.sb:hover:not(.on){border-color:var(--line2);color:var(--text)}
.ir{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(26,37,53,.9);font-size:13px}
.ir:last-child{border-bottom:none}
.il{color:var(--muted);font-weight:500}
.iv{font-weight:600;color:var(--text)}
.pb{height:9px;border-radius:5px;background:rgba(26,37,53,1);overflow:hidden;margin-top:9px}
.pf{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width 1.2s cubic-bezier(.16,1,.3,1)}
.psw{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:18px;max-height:170px;overflow-y:auto;padding-right:4px}
.psw::-webkit-scrollbar{width:4px}
.psw::-webkit-scrollbar-track{background:transparent}
.psw::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
.pb2{padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--muted);cursor:pointer;font-size:10px;font-weight:600;transition:all .2s;font-family:inherit;text-align:center}
.pb2.on{border-color:var(--acc);color:var(--acc);background:rgba(0,212,255,.07)}
.pb2:hover:not(.on){border-color:var(--line2);color:var(--muted2)}
.ctv{background:#000;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:1}
.lbl{position:absolute;font-size:10px;font-weight:700;background:rgba(0,0,0,.8);padding:3px 10px;border-radius:4px}
footer{position:relative;z-index:1;text-align:center;padding:36px;border-top:1px solid var(--line);margin-top:48px}
.ft{font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.fs{font-size:12px;color:var(--muted);line-height:2}
.tag{display:inline-block;padding:3px 10px;border-radius:6px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.15);color:var(--acc);font-size:10px;font-weight:600;letter-spacing:.5px;margin:4px 3px}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-g1"></div>
<div class="bg-g2"></div>
<div class="splash" id="sp">
  <div class="sp-logo">ProtonAI</div>
  <div class="sp-sub">AI-Powered Proton Therapy Decision Support</div>
  <div class="sp-name">Ali Hussein Thajil</div>
  <div class="sp-track"><div class="sp-fill"></div></div>
</div>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const GRP={
  0:{k:"A",en:"A — Focused High-Dose",ar:"A — جرعة عالية مركزة",dose:"74 Gy",fx:37,beam:"IMPT",margin:"3 mm",conf:.87,cnt:173,col:"#ef4444",den:"Small dense tumor — precise targeted radiation",dar:"ورم صغير وكثيف — تشعيع دقيق ومركز"},
  1:{k:"B",en:"B — Wide-Field High-Dose",ar:"B — تغطية واسعة",dose:"70 Gy",fx:35,beam:"PSPT",margin:"5 mm",conf:.79,cnt:154,col:"#00d4ff",den:"Large solid tumor — wide field high-dose coverage",dar:"ورم كبير وصلب — تغطية واسعة بجرعة عالية"},
  2:{k:"C",en:"C — Standard Protocol",ar:"C — بروتوكول قياسي",dose:"66 Gy",fx:33,beam:"IMPT",margin:"4 mm",conf:.83,cnt:94,col:"#a78bfa",den:"Moderate soft tumor — standard proton protocol",dar:"ورم متوسط ولين — بروتوكول قياسي"}
};
function CTView({p}){
  const cv=useRef();
  useEffect(()=>{
    if(!cv.current||!p)return;
    const ctx=cv.current.getContext("2d"),W=240,H=240;
    cv.current.width=W;cv.current.height=H;
    const seed=p.id?p.id.charCodeAt(p.id.length-1)*7:99;
    const cx=W/2+(seed%22)-11,cy=H/2+((seed*3)%18)-9;
    const r=Math.max(16,Math.min(p.volume?Math.sqrt(p.volume)/4.5:28,42));
    const img=ctx.createImageData(W,H);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const i=(y*W+x)*4,d=Math.sqrt((x-W/2)**2+(y-H/2)**2);
      const lung=d<90,rib=d>82&&d<92&&((x+y+seed)%12<2);
      const tu=Math.sqrt((x-cx)**2+(y-cy)**2)<r;
      let g=lung?38+((x*y+seed)%18):8+((x+y)%6);
      if(rib)g=120;
      img.data[i]=img.data[i+1]=img.data[i+2]=g;img.data[i+3]=255;
      if(tu){img.data[i]=240;img.data[i+1]=50;img.data[i+2]=50;}
    }
    ctx.putImageData(img,0,0);
    ctx.strokeStyle="rgba(0,212,255,.5)";ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.arc(cx,cy,r+6,0,Math.PI*2);ctx.stroke();
  },[p]);
  return(
    <div className="ctv">
      <canvas ref={cv} style={{width:"100%",height:"100%",imageRendering:"pixelated"}}/>
      <div className="lbl" style={{bottom:10,left:10,color:"#00d4ff"}}>CT · {p?.id||"—"} · GTV-1</div>
      <div className="lbl" style={{top:10,right:10,color:"#ef4444"}}>● Tumor</div>
      <div className="lbl" style={{top:10,left:10,color:"#64748b"}}>{p?.slices||"—"} slices</div>
    </div>
  );
}
function App(){
  const [ar,setAr]=useState(false);
  const [sg,setSg]=useState(1);
  const [sp,setSp]=useState(0);
  const [pts,setPts]=useState([]);
  const [loading,setLoading]=useState(true);
  const g=GRP[sg],p=pts[sp]||{};
  const gc=["#ef4444","#00d4ff","#a78bfa"];
  useEffect(()=>{
    setTimeout(()=>{const s=document.getElementById("sp");if(s)s.classList.add("out")},3200);
    fetch("patients_data.json").then(r=>r.json()).then(d=>{setPts(d);setLoading(false);}).catch(()=>setLoading(false));
  },[]);
  useEffect(()=>{document.documentElement.dir=ar?"rtl":"ltr";},[ar]);
  const L=(en,a)=>ar?a:en;
  return(<>
    <header>
      <div className="h-brand">
        <div className="h-logo">ProtonAI NEXUS</div>
        <span className="h-sub">AI-Powered Proton Therapy Platform</span>
      </div>
      <div className="h-nav">
        <span className="badge">v1.0</span>
        <span className="badge">421 Patients</span>
        <span className="badge-green badge">NSCLC-Radiomics</span>
        <span className="badge">Medical Engineering</span>
        <button className="btn-lang" onClick={()=>setAr(!ar)}>{ar?"EN":"ع"}</button>
      </div>
    </header>
    <main>
      <div className="hero">
        <div className="hero-pill"><span className="hero-dot"/>{L("AI-Powered Proton Therapy Decision Support","نظام ذكاء اصطناعي لتحسين دقة العلاج بالبروتون")}</div>
        <h1 className="hero-h">{L("Platform","منصة")} <span>ProtonAI</span><br/>{L("for Precision Proton Therapy","لتحسين دقة العلاج بالبروتون")}</h1>
        <p className="hero-p">{L("Automatic extraction of 19 radiomic features from CT scans. AI classification of tumor phenotypes into optimal proton therapy protocols — real data, 421 patients.","استخراج تلقائي لـ 19 خاصية كمية من صور CT. تصنيف بالذكاء الاصطناعي لأنماط الورم لاقتراح بروتوكول العلاج الأمثل — بيانات حقيقية، 421 مريض.")}</p>
        <div className="hero-sig">{L("Designed & Developed by: Ali Hussein Thajil","تصميم وتطوير: علي حسين ثجيل")}</div>
      </div>
      <div className="stats">
        {[{n:"421",l:L("Patients Analyzed","مريض محلل")},{n:"19",l:L("Radiomic Features","خاصية كمية")},{n:"3",l:L("Treatment Groups","مجموعات علاجية")},{n:"52K",l:L("DICOM Images","صورة DICOM")},{n:"98%",l:L("Accuracy","الدقة")}].map((s,i)=>(
          <div className="sc" key={i}><div className="sn">{s.n}</div><div className="sl">{s.l}</div></div>
        ))}
      </div>
      <div className="g2">
        <div className="card card-hl">
          <div className="ct"><div className="ct-bar"/>{L("Radiomic Tumor Classifier","مصنف الورم الإشعاعي")}</div>
          <div className="sel">
            {[0,1,2].map(i=>(
              <button key={i} className={`sb${sg===i?" on":""}`} onClick={()=>setSg(i)}>
                {L(`Group ${GRP[i].k}`,`المجموعة ${GRP[i].k}`)}
              </button>
            ))}
          </div>
          <span className={`gb g${g.k}`}>◆ {ar?g.ar:g.en}</span>
          <p style={{fontSize:13,color:"var(--muted2)",marginBottom:22,lineHeight:1.6}}>{ar?g.dar:g.den}</p>
          <div className="ir"><span className="il">{L("Total Dose","الجرعة الكلية")}</span><span className="iv">{g.dose}</span></div>
          <div className="ir"><span className="il">{L("Fractions","عدد الجلسات")}</span><span className="iv">{g.fx} {L("sessions","جلسة")}</span></div>
          <div className="ir"><span className="il">{L("Beam Arrangement","نوع الحزمة")}</span><span className="iv">{g.beam}</span></div>
          <div className="ir"><span className="il">{L("Robustness Margin","هامش الصلابة")}</span><span className="iv">{g.margin}</span></div>
          <div className="ir"><span className="il">{L("Patients in Group","عدد المرضى")}</span><span className="iv" style={{color:g.col}}>{g.cnt}</span></div>
          <div style={{marginTop:18}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:7}}>
              <span style={{color:"var(--muted)"}}>{L("Classification Confidence","دقة التصنيف")}</span>
              <span style={{fontWeight:800,color:"var(--acc)"}}>{(g.conf*100).toFixed(1)}%</span>
            </div>
            <div className="pb"><div className="pf" style={{width:`${g.conf*100}%`}}/></div>
          </div>
        </div>
        <div className="card">
          <div className="ct"><div className="ct-bar"/>{L("CT Image Viewer — GTV-1","عارض صور CT — GTV-1")}</div>
          <CTView p={p}/>
          <div style={{marginTop:14,display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:12,color:"#ef4444",fontWeight:600}}>● {L("Tumor Region","منطقة الورم")}</span>
            <span style={{fontSize:12,color:"#00d4ff",fontWeight:600}}>⊙ {L("GTV-1 Contour","حدود GTV-1")}</span>
            <span style={{fontSize:12,color:"#64748b",fontWeight:600}}>○ {L("Lung Tissue","أنسجة الرئة")}</span>
          </div>
        </div>
      </div>
      <div className="card" style={{marginBottom:20}}>
        <div className="ct"><div className="ct-bar"/>{L("Patient Explorer — Real NSCLC-Radiomics Data","استكشاف المرضى — بيانات NSCLC-Radiomics الحقيقية")} {loading&&"⟳"}</div>
        {pts.length>0?(
          <>
          <div className="psw">
            {pts.map((pt,i)=>(
              <button key={i} className={`pb2${sp===i?" on":""}`} onClick={()=>setSp(i)}>
                {pt.id?.replace("LUNG1-","")||i+1}
              </button>
            ))}
          </div>
          <div className="g3" style={{marginTop:18}}>
            <div>
              <div className="ir"><span className="il">{L("Patient ID","رقم المريض")}</span><span className="iv" style={{color:"var(--acc)",fontSize:12}}>{p.id||"—"}</span></div>
              <div className="ir"><span className="il">{L("Age","العمر")}</span><span className="iv">{p.age||"—"} {p.age&&L("yrs","سنة")}</span></div>
              <div className="ir"><span className="il">{L("Gender","الجنس")}</span><span className="iv">{p.gender||"—"}</span></div>
              <div className="ir"><span className="il">{L("Stage","المرحلة")}</span><span className="iv">{p.stage||"—"}</span></div>
            </div>
            <div>
              <div className="ir"><span className="il">{L("Histology","نوع الورم")}</span><span className="iv" style={{fontSize:12}}>{p.histology||"—"}</span></div>
              <div className="ir"><span className="il">{L("Survival","البقاء")}</span><span className="iv">{p.survival||"—"} {p.survival&&L("days","يوم")}</span></div>
              <div className="ir"><span className="il">{L("Volume","الحجم")}</span><span className="iv">{p.volume?p.volume.toLocaleString():"—"} vx</span></div>
              <div className="ir"><span className="il">{L("Mean HU","متوسط HU")}</span><span className="iv">{p.meanHU||"—"}</span></div>
            </div>
            <div>
              <div className="ir"><span className="il">{L("Entropy","الانتروبيا")}</span><span className="iv">{p.entropy||"—"}</span></div>
              <div className="ir"><span className="il">{L("Skewness","الانحراف")}</span><span className="iv">{p.skewness||"—"}</span></div>
              <div className="ir"><span className="il">{L("CT Slices","الشرائح")}</span><span className="iv">{p.slices||"—"}</span></div>
              <div className="ir"><span className="il">{L("Protocol","البروتوكول")}</span>
                <span className="iv" style={{color:p.group!==undefined?gc[p.group]:"var(--text)",fontSize:12,fontWeight:800}}>
                  {p.protocol||"—"}
                </span>
              </div>
            </div>
          </div>
          </>
        ):(
          <div style={{textAlign:"center",color:"var(--muted)",padding:"28px 0",fontSize:14}}>{loading?L("Loading patient data...","جاري تحميل بيانات المرضى..."):"—"}</div>
        )}
      </div>
    </main>
    <footer>
      <div className="ft">ProtonAI NEXUS</div>
      <div className="f
