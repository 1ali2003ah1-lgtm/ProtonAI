<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ProtonAI NEXUS — Ali Hussein Thajil</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
:root{
  --bg:#030712;--bg2:#070f1a;--card:#0d1626;--card2:#111827;
  --line:#1e2d3d;--line2:#243447;
  --acc:#00d4ff;--acc2:#7c3aed;--acc3:#06ffa5;
  --text:#e2e8f0;--muted:#64748b;--white:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* Background */
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;z-index:0}
.bg-glow1{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.08),transparent 70%);top:-200px;right:-100px;pointer-events:none;z-index:0}
.bg-glow2{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.08),transparent 70%);bottom:-200px;left:-100px;pointer-events:none;z-index:0}

/* Splash Screen */
.splash{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease,visibility .8s ease}
.splash.hidden{opacity:0;visibility:hidden}
.splash-logo{font-size:64px;font-weight:900;background:linear-gradient(135deg,var(--acc),var(--acc2),var(--acc3));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:16px;animation:logoIn 1s ease}
.splash-sub{font-size:18px;color:var(--muted);margin-bottom:8px;animation:fadeUp .8s ease .3s both}
.splash-name{font-size:14px;color:var(--acc);font-weight:600;letter-spacing:2px;text-transform:uppercase;animation:fadeUp .8s ease .5s both}
.splash-bar{width:200px;height:2px;background:var(--line);border-radius:1px;margin-top:40px;overflow:hidden;animation:fadeUp .8s ease .7s both}
.splash-progress{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:1px;animation:progress 2s ease .8s both}
@keyframes logoIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes progress{from{width:0}to{width:100%}}

/* Header */
header{position:sticky;top:0;z-index:100;background:rgba(3,7,18,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-0.5px}
.logo-sub{font-size:11px;color:var(--muted);font-weight:400;display:block;letter-spacing:1px}
.nav{display:flex;gap:8px;align-items:center}
.nav-btn{padding:6px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;font-family:inherit}
.nav-btn:hover,.nav-btn.active{border-color:var(--acc);color:var(--acc);background:rgba(0,212,255,.05)}
.nav-badge{padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid rgba(0,212,255,.3);color:var(--acc);background:rgba(0,212,255,.05)}
.btn-lang{padding:6px 14px;border-radius:8px;border:1px solid var(--acc2);background:rgba(124,58,237,.1);color:var(--acc2);cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;font-family:inherit}
.btn-lang:hover{background:rgba(124,58,237,.2)}

/* Main */
main{position:relative;z-index:1;padding:32px}

/* Hero */
.hero{text-align:center;padding:48px 0 40px;max-width:800px;margin:0 auto}
.hero-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;border:1px solid rgba(0,212,255,.3);background:rgba(0,212,255,.05);font-size:12px;color:var(--acc);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:24px}
.hero-dot{width:6px;height:6px;border-radius:50%;background:var(--acc3);animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hero-title{font-size:52px;font-weight:900;line-height:1.1;margin-bottom:16px;letter-spacing:-1px}
.hero-title span{background:linear-gradient(135deg,var(--acc),var(--acc2),var(--acc3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-desc{font-size:16px;color:var(--muted);line-height:1.7;max-width:600px;margin:0 auto 32px}
.hero-author{font-size:13px;color:var(--acc);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:8px 20px;border:1px solid rgba(0,212,255,.2);border-radius:999px;display:inline-block}

/* Stats Row */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:32px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center;position:relative;overflow:hidden;transition:border-color .3s}
.stat-card:hover{border-color:var(--acc)}
.stat-card::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,212,255,.03),transparent);pointer-events:none}
.stat-num{font-size:36px;font-weight:900;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.stat-label{font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.8px;font-weight:500}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;transition:border-color .3s}
.card:hover{border-color:var(--line2)}
.card-accent{border-color:rgba(0,212,255,.2);background:linear-gradient(135deg,var(--card),rgba(0,212,255,.02))}
.card-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title::before{content:"";width:3px;height:14px;background:linear-gradient(var(--acc),var(--acc2));border-radius:2px;display:block}

/* Group Badges */
.group-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;font-weight:700;font-size:13px;margin-bottom:16px;letter-spacing:.3px}
.group-A{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.3)}
.group-B{background:rgba(0,212,255,.1);color:var(--acc);border:1px solid rgba(0,212,255,.3)}
.group-C{background:rgba(124,58,237,.1);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}

/* Selector */
.selector{display:flex;gap:8px;margin-bottom:20px}
.sel-btn{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;font-family:inherit;text-align:center}
.sel-btn:hover{border-color:var(--line2);color:var(--text)}
.sel-btn.active{border-color:var(--acc);color:var(--acc);background:rgba(0,212,255,.08)}

/* Table */
.info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(30,45,61,.8);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--muted);font-weight:500}
.info-value{font-weight:600;color:var(--text)}

/* Bar */
.progress-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width 1s ease}

/* Patient Demo */
.patient-selector{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;max-height:200px;overflow-y:auto}
.patient-btn{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;transition:all .2s;font-family:inherit;text-align:center}
.patient-btn:hover{border-color:var(--line2);color:var(--text)}
.patient-btn.active{border-color:var(--acc);color:var(--acc);background:rgba(0,212,255,.08)}

/* CT Viewer */
.ct-viewer{background:#000;border-radius:16px;overflow:hidden;position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.ct-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}

/* Footer */
footer{position:relative;z-index:1;text-align:center;padding:32px;border-top:1px solid var(--line);margin-top:40px}
.footer-title{font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.footer-sub{font-size:12px;color:var(--muted);line-height:1.8}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow1"></div>
<div class="bg-glow2"></div>

<div class="splash" id="splash">
  <div class="splash-logo">ProtonAI</div>
  <div class="splash-sub">AI-Powered Proton Therapy Decision Support</div>
  <div class="splash-name">— Ali Hussein Thajil —</div>
  <div class="splash-bar"><div class="splash-progress"></div></div>
</div>

<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useRef} = React;

const PATIENTS_DATA = [];
}));

const GROUPS = {
  0:{key:"A",label_en:"A — Focused High-Dose",label_ar:"A — جرعة عالية مركزة",
     dose:"74 Gy",fractions:37,beam:"IMPT",margin:"3 mm",confidence:0.87,count:173,
     color:"#ef4444",desc_en:"Small dense tumor — precise targeted radiation",desc_ar:"ورم صغير وكثيف — تشعيع دقيق ومركز"},
  1:{key:"B",label_en:"B — Wide-Field High-Dose",label_ar:"B — تغطية واسعة",
     dose:"70 Gy",fractions:35,beam:"PSPT",margin:"5 mm",confidence:0.79,count:154,
     color:"#00d4ff",desc_en:"Large solid tumor — wide field coverage",desc_ar:"ورم كبير وصلب — تغطية واسعة"},
  2:{key:"C",label_en:"C — Standard Protocol",label_ar:"C — بروتوكول قياسي",
     dose:"66 Gy",fractions:33,beam:"IMPT",margin:"4 mm",confidence:0.83,count:94,
     color:"#a78bfa",desc_en:"Moderate soft tumor — standard protocol",desc_ar:"ورم متوسط ولين — بروتوكول قياسي"},
};

function CTViewer({patient}) {
  const cv = useRef();
  useEffect(()=>{
    if(!cv.current) return;
    const ctx = cv.current.getContext("2d");
    const W=200, H=200;
    cv.current.width=W; cv.current.height=H;
    const img = ctx.createImageData(W,H);
    const cx=W/2+Math.random()*20-10, cy=H/2+Math.random()*20-10;
    const r = 20+Math.random()*30;
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const i=(y*W+x)*4;
      const dist=Math.sqrt((x-W/2)**2+(y-H/2)**2);
      const lung=dist<80;
      const tumor=Math.sqrt((x-cx)**2+(y-cy)**2)<r;
      let g=lung?(40+Math.random()*30):(10+Math.random()*10);
      if(tumor) g=180+Math.random()*50;
      img.data[i]=img.data[i+1]=img.data[i+2]=g;
      img.data[i+3]=255;
      if(tumor){img.data[i]=255;img.data[i+1]=80;img.data[i+2]=80;}
    }
    ctx.putImageData(img,0,0);
  },[patient]);
  return(
    <div className="ct-viewer">
      <canvas ref={cv} style={{width:"100%",height:"100%",imageRendering:"pixelated"}}/>
      <div style={{position:"absolute",bottom:8,left:8,fontSize:10,color:"#00d4ff",fontWeight:600,background:"rgba(0,0,0,.7)",padding:"2px 8px",borderRadius:4}}>
        CT — {patient?.id} | GTV-1
      </div>
      <div style={{position:"absolute",top:8,right:8,fontSize:10,color:"#ef4444",fontWeight:600,background:"rgba(0,0,0,.7)",padding:"2px 8px",borderRadius:4}}>
        ● Tumor Region
      </div>
    </div>
  );
}

function App(){
  const [lang,setLang]=useState("en");
  const [selGroup,setSelGroup]=useState(1);
  const [selPatient,setSelPatient]=useState(0);
  const [patients,setPatients]=useState([]);
useEffect(()=>{
  fetch('patients_data.json')
    .then(r=>r.json())
    .then(d=>setPatients(d))
    .catch(()=>setPatients(PATIENTS_DATA));
},[]);
const p=patients[selPatient]||{};
  const ar=lang==="ar";
  const g=GROUPS[selGroup];

  useEffect(()=>{
    document.documentElement.dir=ar?"rtl":"ltr";
    setTimeout(()=>{
      const s=document.getElementById("splash");
      if(s) s.classList.add("hidden");
    },3000);
  },[]);

  useEffect(()=>{document.documentElement.dir=ar?"rtl":"ltr";},[ar]);

  return(<>
    <header>
      <div>
        <div className="logo">ProtonAI NEXUS</div>
        <span className="logo-sub">AI-Powered Proton Therapy Platform</span>
      </div>
      <nav className="nav">
        <span className="nav-badge">v1.0</span>
        <span className="nav-badge">421 Patients</span>
        <span className="nav-badge">NSCLC-Radiomics</span>
        <button className="btn-lang" onClick={()=>setLang(ar?"en":"ar")}>{ar?"EN":"ع"}</button>
      </nav>
    </header>

    <main>
      <div className="hero">
        <div className="hero-tag">
          <span className="hero-dot"/>
          {ar?"نظام ذكاء اصطناعي لتحسين دقة العلاج بالبروتون":"AI-Powered Proton Therapy Decision Support"}
        </div>
        <h1 className="hero-title">
          {ar?"منصة":"Platform"} <span>ProtonAI</span><br/>
          {ar?"لتحسين دقة العلاج بالبروتون":"for Precision Proton Therapy"}
        </h1>
        <p className="hero-desc">
          {ar
            ?"استخراج خصائص الأورام من صور CT وتصنيفها تلقائياً لاقتراح بروتوكول العلاج الأمثل لكل مريض"
            :"Automatic extraction of tumor radiomic features from CT scans to recommend the optimal proton therapy protocol per patient"
          }
        </p>
        <div className="hero-author">
          {ar?"تصميم وتطوير: علي حسين ثجيل":"Designed & Developed by: Ali Hussein Thajil"}
        </div>
      </div>

      <div className="stats-row">
        {[
          {n:"421",l:ar?"مريض محلل":"Patients Analyzed"},
          {n:"19",l:ar?"خاصية كمية":"Radiomic Features"},
          {n:"3",l:ar?"مجموعات علاجية":"Treatment Groups"},
          {n:"52K",l:ar?"صورة DICOM":"DICOM Images"},
          {n:"98%",l:ar?"دقة التصنيف":"Classification Acc."},
        ].map((s,i)=>(
          <div className="stat-card" key={i}>
            <div className="stat-num">{s.n}</div>
            <div className="stat-label">{s.l}</div>
          </div>
        ))}
      </div>

      <div className="grid-2">
        <div className="card card-accent">
          <div className="card-title">{ar?"مصنف الورم الإشعاعي":"Radiomic Tumor Classifier"}</div>
          <div className="selector">
            {[0,1,2].map(i=>(
              <button key={i} className={`sel-btn${selGroup===i?" active":""}`} onClick={()=>setSelGroup(i)}>
                {ar?`المجموعة ${GROUPS[i].key}`:`Group ${GROUPS[i].key}`}
              </button>
            ))}
          </div>
          <span className={`group-badge group-${g.key}`}>◆ {ar?g.label_ar:g.label_en}</span>
          <p style={{fontSize:13,color:"var(--muted)",marginBottom:20}}>{ar?g.desc_ar:g.desc_en}</p>
          <div className="info-row"><span className="info-label">{ar?"الجرعة الكلية":"Total Dose"}</span><span className="info-value">{g.dose}</span></div>
          <div className="info-row"><span className="info-label">{ar?"عدد الجلسات":"Fractions"}</span><span className="info-value">{g.fractions} {ar?"جلسة":"sessions"}</span></div>
          <div className="info-row"><span className="info-label">{ar?"نوع الحزمة":"Beam Arrangement"}</span><span className="info-value">{g.beam}</span></div>
          <div className="info-row"><span className="info-label">{ar?"هامش الصلابة":"Robustness Margin"}</span><span className="info-value">{g.margin}</span></div>
          <div className="info-row"><span className="info-label">{ar?"عدد المرضى":"Patients"}</span><span className="info-value" style={{color:g.color}}>{g.count}</span></div>
          <div style={{marginTop:16}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6}}>
              <span style={{color:"var(--muted)"}}>{ar?"دقة التصنيف":"Confidence Score"}</span>
              <span style={{fontWeight:700,color:"var(--acc)"}}>{(g.confidence*100).toFixed(1)}%</span>
            </div>
            <div className="progress-bar"><div className="progress-fill" style={{width:`${g.confidence*100}%`}}/></div>
          </div>
        </div>

        <div className="card">
          <div className="card-title">{ar?"عارض صور CT":"CT Image Viewer"}</div>
          <CTViewer patient={p}/>
          <div style={{marginTop:12,fontSize:12,color:"var(--muted)",textAlign:"center"}}>
            {ar?"المنطقة الحمراء = منطقة الورم (GTV-1)":"Red region = Tumor Volume (GTV-1)"}
          </div>
        </div>
      </div>

      <div className="card" style={{marginBottom:20}}>
        <div className="card-title">{ar?"تفاصيل المريض — Demo":"Patient Details — Demo"}</div>
        <div className="patient-selector">
          {PATIENTS.map((pt,i)=>(
            <button key={i} className={`patient-btn${selPatient===i?" active":""}`} onClick={()=>setSelPatient(i)}>
              {pt.id}
            </button>
          ))}
        </div>
        <div className="grid-3" style={{marginBottom:0,marginTop:16}}>
          <div>
            <div className="info-row"><span className="info-label">{ar?"المريض":"Patient ID"}</span><span className="info-value">{p.id}</span></div>
            <div className="info-row"><span className="info-label">{ar?"العمر":"Age"}</span><span className="info-value">{p.age} {ar?"سنة":"yrs"}</span></div>
            <div className="info-row"><span className="info-label">{ar?"الجنس":"Gender"}</span><span className="info-value">{ar?(p.gender==="Male"?"ذكر":"أنثى"):p.gender}</span></div>
          </div>
          <div>
            <div className="info-row"><span className="info-label">{ar?"مرحلة السرطان":"Stage"}</span><span className="info-value">{p.stage}</span></div>
            <div className="info-row"><span className="info-label">{ar?"نوع الورم":"Histology"}</span><span className="info-value">{p.histology}</span></div>
            <div className="info-row"><span className="info-label">{ar?"وقت البقاء":"Survival"}</span><span className="info-value">{p.survival} {ar?"يوم":"days"}</span></div>
          </div>
          <div>
            <div className="info-row"><span className="info-label">{ar?"حجم الورم":"Volume"}</span><span className="info-value">{p.volume.toLocaleString()} vx</span></div>
            <div className="info-row"><span className="info-label">{ar?"متوسط الكثافة":"Mean HU"}</span><span className="info-value">{p.meanHU}</span></div>
            <div className="info-row"><span className="info-label">{ar?"بروتوكول العلاج":"Protocol"}</span><span className="info-value" style={{color:GROUPS[p.group].color}}>{`Group ${GROUPS[p.group].key}`}</span></div>
          </div>
        </div>
      </div>

    </main>

    <footer>
      <div className="footer-title">ProtonAI NEXUS</div>
      <div className="footer-sub">
        {ar
          ?"تصميم وتطوير: علي حسين ثجيل — مشروع تخرج هندسة طبية\nمبني على بيانات NSCLC-Radiomics من The Cancer Imaging Archive (TCIA)"
          :"Designed & Developed by Ali Hussein Thajil — Medical Engineering Graduation Project\nBuilt on NSCLC-Radiomics dataset from The Cancer Imaging Archive (TCIA)"
        }
      </div>
    </footer>
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
