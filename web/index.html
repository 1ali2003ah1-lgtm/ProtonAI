<!doctype html><html><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ProtonAI NEXUS</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--bg:#070b14;--card:rgba(22,27,39,.7);--line:#2a3242;--acc:#22d3ee;--acc2:#a78bfa}
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:
 radial-gradient(1200px 600px at 80% -10%,#12305a55,transparent),
 radial-gradient(900px 500px at 10% 110%,#4c1d9555,transparent),var(--bg);
 color:#e6edf3;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px}
.logo{font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));
 -webkit-background-clip:text;background-clip:text;color:transparent}
.pill{padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;padding:0 28px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
 padding:18px;backdrop-filter:blur(12px);animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h3{margin:0 0 12px;font-size:14px;letter-spacing:.5px;color:#9fb0c8}
.big{font-size:34px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));
 -webkit-background-clip:text;color:transparent}
canvas{width:100%;border-radius:10px;image-rendering:pixelated}
input[type=range]{width:100%;accent-color:var(--acc)}
select,button{background:#1b2334;color:#e6edf3;border:1px solid var(--line);
 border-radius:8px;padding:6px 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
svg{width:100%}
</style></head><body><div id="root"></div>
<script type="text/babel">
const {useEffect,useRef,useState}=React;
const T={en:{t:"Clinical Cockpit",viewer:"Image Viewer",win:"Window",slice:"Slice",
 gt:"Ground truth",ai:"AI / ONNX",unc:"Uncertainty",whatif:"What-if contour shift",
 d95:"Target D95",dvh:"Dose-Volume Histogram",pms:"PMS State",verdict:"D95 Verdict",
 phys:"Physics Conf.",triage:"Cross-domain Triage",impact:"Dose-Impact (B5)",lang:"ع"},
 ar:{t:"الكوكبيت السريري",viewer:"عارض الشرائح",win:"النافذة",slice:"الشريحة",
 gt:"الحقيقة",ai:"الذكاء الاصطناعي",unc:"عدم اليقين",whatif:"إزاحة الـ contour (ماذا لو)",
 d95:"D95 للهدف",dvh:"منحنى الحجم-الجرعة",pms:"حالة PMS",verdict:"حكم D95",
 phys:"ثقة الفيزياء",triage:"الفرز متعدد النطاقات",impact:"أثر الجرعة (ب5)",lang:"EN"}};
function useAPI(u,init){const[s,setS]=useState(init);useEffect(()=>{fetch(u)
 .then(r=>r.json()).then(setS).catch(()=>{});},[u]);return s;}
function Viewer({lang}){const t=T[lang];const cv=useRef();
 const [z,setZ]=useState(0);const [w,setW]=useState("mediastinum");
 const [gt,setGt]=useState(true);const [ai,setAi]=useState(true);
 useEffect(()=>{fetch(`/api/slice?z=${z}`).then(r=>r.json()).then(d=>{
  const c=cv.current;const ctx=c.getContext("2d");
  const img=ctx.createImageData(60,40); // note w x h
  for(let y=0;y<60;y++)for(let x=0;x<40;x++){const i=(y*40+x)*4;
   const g=d.gray[y][x];img.data[i]=g;img.data[i+1]=g;img.data[i+2]=g;img.data[i+3]=255;
   if(gt&&d.gt[y][x]){img.data[i]=0;img.data[i+1]=220;img.data[i+2]=90;}
   if(ai&&d.ai[y][x]){img.data[i]=60;img.data[i+1]=140;img.data[i+2]=255;}}
  ctx.putImageData(img,0,0);});},[z,gt,ai]);
 return <div className="card"><h3>{t.viewer}</h3>
  <canvas ref={cv} width="40" height="60" style={{height:280}}/>
  <div className="row" style={{marginTop:10}}>
   <select value={w} onChange={e=>setW(e.target.value)}>
    {["mediastinum","lung","bone","brain"].map(p=><option key={p}>{p}</option>)}</select>
   <label><input type="checkbox" checked={gt} onChange={e=>setGt(e.target.checked)}/>{t.gt}</label>
   <label><input type="checkbox" checked={ai} onChange={e=>setAi(e.target.checked)}/>{t.ai}</label>
  </div>
  <input type="range" min="0" max="7" value={z} onChange={e=>setZ(+e.target.value)}/>
  {t.slice}: {z}</div>;}
function DVH({shift}){const d=useAPI(`/api/dvh?shift=${shift}`,null);
 const base=useAPI(`/api/dvh?shift=0`,null);
 if(!d||!base)return <div className="card"><h3>DVH</h3>…</div>;
 const P=(arr,col)=>{const pts=arr.cum.map((c,i)=>`${(arr.bins[i]/1.1)*300},${120-c*100}`).join(" ");
  return <polyline points={pts} fill="none" stroke={col} strokeWidth="2.5"/>;};
 return <div className="card"><h3>DVH</h3><svg viewBox="0 0 300 120">
  {P(base,"#22d3ee")}{shift>0&&P(d,"#f472b6")}</svg></div>;}
function App(){const [lang,setLang]=useState("en");const t=T[lang];
 const [shift,setShift]=useState(0);const [d95,setD95]=useState(null);
 const s=useAPI("/api/summary",null);const di=useAPI("/api/dose-impact",null);
 useEffect(()=>{document.documentElement.dir=lang==="ar"?"rtl":"ltr";},[lang]);
 useEffect(()=>{fetch("/api/whatif",{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({shift})}).then(r=>r.json()).then(r=>setD95(r.d95));},[shift]);
 return <div>
  <header><span className="logo">ProtonAI NEXUS</span>
   <span className="row"><span className="pill">{t.t}</span>
   <button onClick={()=>setLang(lang==="en"?"ar":"en")}>{t.lang}</button></span></header>
  <div className="grid">
   <div><Viewer lang={lang}/><DVH shift={shift}/></div>
   <div>
    <div className="card"><h3>{t.whatif}</h3>
     <input type="range" min="0" max="10" value={shift} onChange={e=>setShift(+e.target.value)}/>
     <div className="big">{t.d95}: {d95!=null?d95.toFixed(3):"…"}</div></div>
    <div className="card"><h3>{t.impact}</h3>
     <div className="big">{di&&di.d95?di.d95.verdict:"…"}</div>
     <p>{di&&di.conclusion?di.conclusion:""}</p></div>
    <div className="card"><h3>{t.pms} / {t.verdict}</h3>
     {s?`${s.pms_state} · ${s.d95_verdict}`:"…"}</div>
   </div>
  </div></div>;}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
