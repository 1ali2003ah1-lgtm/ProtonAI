name: ProtonAI CI/CD Pipeline

# تشغيل هذا العمل عند كل push أو pull request على الفرع الرئيسي
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    # 1. سحب الكود من المستودع
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. إعداد بيئة Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. تثبيت المكتبات المطلوبة
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # إذا كان لديك ملف requirements.txt، استخدم السطر التالي بدلاً من السطر الذي بعده:
        # pip install -r requirements.txt
        pip install pytest pydantic

    # 4. تشغيل الاختبارات الآلية
    - name: Run Automated Tests
      run: |
        pytest test_validators.py -v
